name: Enregistrer les games
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: record-games
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Enregistrer le vainqueur de chaque game
        run: perl .github/scripts/record-games.pl
