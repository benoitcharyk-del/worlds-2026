<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050827">

<title>Worlds 2026 Live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: sticky header with tabs, favourite-match banner on top, then day-grouped match list / standings / bracket. */
:root{
  --bg:#f3f4f7; --card:#fff; --ink:#14161a; --muted:#5b6270; --line:#e2e5ea; --soft:#eceef2;
  --accent:#0f6e6a; --accent-ink:#fff; --ok:#177a3c; --bad:#b4281f; --warn:#8a5a00;
  --kc:#2358f0; --g2:#111214; --t1:#d91c2c;
  --sky1:#dfe6ff; --sky2:#f3f4f7; --glow:#2a46e8; --pink:#ff6fd0; --bld:#2a3f9c; --f0:#0f8a5f; --f1:#c2570c; --f2:#7a3fd1; --f3:#c4247a; --f4:#9a6a00; --f5:#0e7490; --f6:#5b6f00; --f7:#8a4b2a;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1014; --card:#171a20; --ink:#eceef2; --muted:#9aa1ad; --line:#272b33; --soft:#20242c;
  --accent:#3fc1b9; --accent-ink:#06201e; --ok:#4cc57a; --bad:#ff7b72; --warn:#e3b341;
  --kc:#6c93ff; --g2:#f1f2f4; --t1:#ff5d6b; --sky1:#040a30; --sky2:#081359; --glow:#3156ff; --pink:#ff6fd0; --bld:#0a1640; --f0:#4cc99a; --f1:#ff9d5c; --f2:#b794ff; --f3:#ff7ac0; --f4:#e3b341; --f5:#4fd1e8; --f6:#b8d85a; --f7:#d9a07c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1014; --card:#171a20; --ink:#eceef2; --muted:#9aa1ad; --line:#272b33; --soft:#20242c;
  --accent:#3fc1b9; --accent-ink:#06201e; --ok:#4cc57a; --bad:#ff7b72; --warn:#e3b341;
  --kc:#6c93ff; --g2:#f1f2f4; --t1:#ff5d6b; --sky1:#040a30; --sky2:#081359; --glow:#3156ff; --pink:#ff6fd0; --bld:#0a1640; --f0:#4cc99a; --f1:#ff9d5c; --f2:#b794ff; --f3:#ff7ac0; --f4:#e3b341; --f5:#4fd1e8; --f6:#b8d85a; --f7:#d9a07c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:760px;width:100%;margin:0 auto;position:relative;flex:1;display:flex;flex-direction:column}
#view{flex:1}
body{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:12px}
/* background: night skyline under a cobalt horizon glow, pink dusk and light spikes (palette from the Worlds 2026 key art, drawn from scratch) */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(55% 30% at 12% 0%,color-mix(in srgb,#8b5cf6 30%,transparent),transparent 70%),
    radial-gradient(60% 24% at 20% 100%,color-mix(in srgb,#4f7bff 55%,transparent),transparent 72%),
    radial-gradient(60% 24% at 85% 100%,color-mix(in srgb,#9b6bff 45%,transparent),transparent 72%),
    linear-gradient(180deg,var(--sky1),var(--sky2))}
.hero{margin-top:4px}
.hero svg{display:block;width:100%;height:auto;max-height:92px;color:var(--ink)}
.favbar{display:flex;gap:10px;align-items:center}
.favbar .btn{padding:5px 10px;font-size:13px}
.favrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--line)}
.favrow input{width:18px;height:18px;accent-color:var(--accent)}
.favrow i{width:12px;height:12px;border-radius:50%;flex:none}
#favList{max-height:60vh;overflow:auto;margin-bottom:8px}
header{gap:8px!important}
h1{background:linear-gradient(90deg,#4f7bff,#b58cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.title::after{content:"";flex-basis:100%;height:3px;border-radius:2px;background:linear-gradient(90deg,#4f7bff,#b58cff)}
h1{font-size:26px!important}
.next{margin-top:8px!important;padding:10px 14px!important;gap:3px!important}
.next .vs{font-size:22px!important}
.count{font-size:28px!important}
.m{padding:8px 12px!important;margin-bottom:6px!important}
.day{margin-top:10px!important}
.pager{margin-bottom:8px!important}
.bg .floor{position:absolute;left:0;right:0;bottom:0;height:34vh;background:var(--img-logo) center bottom/cover no-repeat;-webkit-mask-image:linear-gradient(transparent,#000 55%);mask-image:linear-gradient(transparent,#000 55%)}
.bg .cup{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .5s}
.bg .cup::before{content:"";position:absolute;inset:-60px;background:var(--bgp) center/cover no-repeat;filter:blur(32px) brightness(.7)}
.bg .cup::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:100%;aspect-ratio:941/1672;background:var(--bgp) center/100% 100% no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.bg{background:#050827}
body :is(.sub,#status,.fav-toggle,.pager h2,.pager h2 small){color:#fff;text-shadow:0 1px 8px rgb(0 0 0/.7)}
body h1.logo{background:#fff}
body .btn.ghost{color:#fff;border-color:rgb(255 255 255/.5)}
body .title::after{background:rgb(255 255 255/.6)}
body{--bgp:var(--img-cup);--bgl:var(--img-cup-l)}
body[data-tab="swiss"]{--bgp:var(--img-swiss);--bgl:var(--img-swiss-l)}
body[data-tab="qf"]{--bgp:var(--img-qf-p);--bgl:var(--img-qf)}
body[data-tab="sf"]{--bgp:var(--img-sf-p);--bgl:var(--img-sf)}
body[data-tab="pi"]{--bgp:var(--img-pi-p);--bgl:var(--img-pi)}
@media (orientation:portrait){
  body[data-tab="swiss"] .bg .cup::after{aspect-ratio:2/3}
  body[data-tab="sf"] .bg .cup::after{aspect-ratio:941/1672}
}
.bg .cup{opacity:1}
.bg .floor{opacity:0}
body[data-tab="pi"] .bg .cup{filter:grayscale(1) brightness(.7)}
@media (orientation:landscape){
  .bg .cup::before{display:none}
  .bg .cup::after{left:0;top:0;transform:none;width:100%;height:100%;aspect-ratio:auto;background:var(--bgl) center/cover no-repeat;-webkit-mask-image:none;mask-image:none}
}
h1.logo{width:clamp(180px,56vw,320px);aspect-ratio:1557/364;background:linear-gradient(90deg,var(--ink),color-mix(in srgb,var(--ink) 65%,#8b5cf6));-webkit-mask:var(--img-logomask) center/100% 100% no-repeat;mask:var(--img-logomask) center/100% 100% no-repeat}
.cupbanner{margin-top:8px;border-radius:14px;aspect-ratio:2.4/1;background:var(--img-cup) center 30%/cover no-repeat;position:relative;overflow:hidden}
.cupbanner span{position:absolute;left:14px;bottom:10px;right:14px;color:#fff;font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;text-shadow:0 2px 12px #000}
.cupbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgb(0 0 0/.65))}
.cupbanner span{z-index:1}
.foot{margin-top:auto;padding-top:30px;padding-bottom:6px;font-size:11px;line-height:1.5;text-align:center;display:grid;gap:2px}
.acts{display:flex;gap:8px}
#view,#next,.foot,.favbar,.tabs{transition:opacity .35s}
body.focus :is(#view,#next,.foot){opacity:.07;pointer-events:none}
body.focus :is(.favbar,.tabs){opacity:.45}
body .foot,body .foot #status{color:rgb(255 255 255/.5);text-shadow:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{padding-top:18px;display:flex;flex-direction:column;gap:12px}
.title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font:700 30px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;border-color:color-mix(in srgb,var(--glow) 45%,var(--line));color:var(--muted);padding:5px 10px;font-size:13px;font-weight:500}
.btn.ghost:hover{color:var(--ink);border-color:var(--glow)}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:10px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.fav-toggle{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;cursor:pointer}
.fav-toggle input{width:18px;height:18px;accent-color:var(--accent)}
#status{font-size:13px;color:var(--muted);min-height:18px}
/* next favourite match */
.next{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.next .lbl{font:600 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.next .vs{font:700 26px/1.1 var(--display);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.next .vs i{font-style:normal;color:var(--muted);font-size:18px}
.count{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.next .meta{color:var(--muted);font-size:13px}
/* teams */
.tm{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:1px 6px;margin-left:-6px;font-weight:600}
.tl{width:22px;height:22px;object-fit:contain;background:#0c1030;border-radius:50%;padding:3px;flex:none}
.tm:has(.tl)::before{display:none}
.tm.tbd{color:var(--muted);font-weight:500;font-style:italic}
.tm[data-fav]{background:color-mix(in srgb,var(--fc) 14%,transparent);color:var(--fc)}
.tm[data-fav]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fc);flex:none}
.tm.lose{opacity:.55}
/* match list */
.day{margin-top:22px}
.day h2{font:600 14px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.day h2::after{content:"";flex:1;height:1px;background:var(--line)}
.pager{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pager h2{flex:1;margin:0;justify-content:center;text-align:center;font-size:16px;color:var(--ink);flex-direction:column;gap:0}
.pager h2::after{display:none}
.pager h2 small{font:500 12px var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:24px;line-height:1;display:grid;place-items:center;padding:0 0 3px}
.nav:disabled{opacity:.35;cursor:default}
.fold{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:600 15px var(--body)}
.fold i{font-style:normal;color:var(--muted)}
.fold+.tbl{margin-top:8px}
.note{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--muted);margin:12px 0 0}
.m{display:grid;grid-template-columns:62px 1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.m:hover{border-color:var(--muted)}
.time{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums}
.time small{display:block;font:500 11px var(--body);color:var(--muted);margin-top:3px}
.rows{display:grid;gap:3px;min-width:0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;min-width:0}
.row .n{overflow-wrap:anywhere}
.sc{font:700 18px var(--display);font-variant-numeric:tabular-nums;min-width:16px;text-align:right}
.sc.w{color:var(--ok)}
.tag{font-size:11px;font-weight:600;color:var(--muted);text-align:right;display:grid;gap:3px;justify-items:end}
.pill{border:1px solid var(--line);border-radius:99px;padding:1px 7px;white-space:nowrap}
.pill.done{color:var(--ok);border-color:currentColor}
.pill.live{color:#ff4d5e;border-color:currentColor;font-weight:700}
.pill.est{color:var(--warn);border-color:currentColor}
.empty{color:var(--muted);text-align:center;padding:30px 0}
/* standings */
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:16px}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.st{font-weight:600;font-size:12px}
.st.q{color:var(--ok)} .st.e{color:var(--bad)} .st.p{color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dots b{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots b.w{background:var(--ok)} .dots b.l{background:var(--bad)}
/* bracket */
.scroll{overflow-x:auto;margin-top:16px;padding-bottom:6px}
.bracket{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:18px;min-width:690px}
.col{display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.col h3{font:600 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.col .m{grid-template-columns:1fr;margin:0}
.col .m .when{font-size:12px;color:var(--muted)}
/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(92vw,420px)}
dialog::backdrop{background:rgb(0 0 0/.5)}
dialog h3{font:700 22px var(--display);margin:0 0 12px}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
select,input[type=number],input[type=datetime-local]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 84px;gap:10px;margin-bottom:10px}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.m{transition:border-color .15s}}
</style>
<style>
:root{--img-logo:url(assets/img-logo.webp);--img-cup:url(assets/img-cup.webp)}
</style>
<style>:root{--img-logomask:url(assets/img-logomask.png)}</style>
<style>:root{--img-swiss:url(assets/img-swiss.webp)}</style>
<style>:root{--img-swiss-l:url(assets/img-swiss-l.webp)}</style>
<style>:root{--img-qf:url(assets/img-qf.webp)}</style>
<style>:root{--img-qf-p:url(assets/img-qf-p.webp)}</style>
<style>:root{--img-sf:url(assets/img-sf.webp)}</style>
<style>:root{--img-sf-p:url(assets/img-sf-p.webp)}</style>
<style>:root{--img-pi:url(assets/img-pi.webp)}</style>
<style>:root{--img-pi-p:url(assets/img-pi-p.webp)}</style>
<style>:root{--img-cup-l:url(assets/img-cup-l.webp)}</style>

</head>
<body>
<div class="bg" aria-hidden="true"><div class="cup"></div><div class="floor"></div>
</div>
<div class="wrap">
<header>
  <div class="title">
    <div><h1 class="logo" role="img" aria-label="Worlds 2026"></h1></div>
    <span class="acts"><button class="btn ghost" id="eye" title="Afficher ou masquer les cartes pour voir le visuel">Visuel</button><button class="btn ghost" id="refresh">Actualiser</button></span>
  </div>
  <div class="bar">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-t="pi" aria-selected="false">Play-in</button>
      <button role="tab" data-t="swiss" aria-selected="true">Suisse</button>
      <button role="tab" data-t="qf" aria-selected="false">Quarts</button>
      <button role="tab" data-t="sf" aria-selected="false">Demies</button>
      <button role="tab" data-t="f" aria-selected="false">Finale</button>
    </div>
    <div class="favbar"><label class="fav-toggle"><input type="checkbox" id="favOnly"> Mes favoris uniquement</label><button class="btn" id="favEdit">Choisir</button></div>
  </div>
</header>
<div id="next"></div>
<main id="view"></main>
<footer class="foot"><div>Heures affichées en heure de Paris · Allen (Texas) puis Brooklyn</div><div id="status" role="status"></div><div>Données : API publique de lolesports.com · Site de fan non officiel, sans but commercial. Worlds 2026, le logo et les visuels appartiennent à Riot Games.</div></footer>
</div>

<dialog id="favDlg">
  <h3>Mes équipes favorites</h3>
  <div id="favList"></div>
  <div class="actions" style="justify-content:flex-end"><button class="btn primary" id="favDone">Terminé</button></div>
</dialog>
<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlgTitle">Match</h3>
    <div class="grid2"><label>Équipe 1<select id="fA"></select></label><label>Score<input type="number" id="fSA" min="0" max="9" inputmode="numeric"></label></div>
    <div class="grid2"><label>Équipe 2<select id="fB"></select></label><label>Score<input type="number" id="fSB" min="0" max="9" inputmode="numeric"></label></div>
    <label>Date et heure (Paris)<input type="datetime-local" id="fT"></label>
    <div class="actions">
      <button type="button" class="btn" id="fClear">Rétablir le score officiel</button>
      <span style="display:flex;gap:8px"><button type="button" class="btn" id="fCancel">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></span>
    </div>
  </form>
</dialog>

<script>
(function(){
'use strict';
var TEAMS=['Gen.G','Anyone\'s Legend','Team Liquid Alienware','G2 Esports','Team Secret Whales','Los Grandes','Hanwha Life Esports','Bilibili Gaming','LYON','Movistar KOI','T1','Top Esports','CTBC Flying Oyster','Invictus Gaming','Dplus KIA','Karmine Corp'];
var LOGOS={"Anyone's Legend":"assets/logos/anyone-s-legend.png","Bilibili Gaming":"assets/logos/bilibili-gaming.png","CTBC Flying Oyster":"assets/logos/ctbc-flying-oyster.png","Cloud9 KIA":"assets/logos/cloud9-kia.png","Dplus KIA":"assets/logos/dplus-kia.png","FURIA":"assets/logos/furia.png","G2 Esports":"assets/logos/g2-esports.png","Gen.G":"assets/logos/gen-g.png","Hanwha Life Esports":"assets/logos/hanwha-life-esports.png","Invictus Gaming":"assets/logos/invictus-gaming.png","Karmine Corp":"assets/logos/karmine-corp.png","LYON":"assets/logos/lyon.png","Los Grandes":"assets/logos/los-grandes.png","MVK Esports":"assets/logos/mvk-esports.png","Movistar KOI":"assets/logos/movistar-koi.png","T1":"assets/logos/t1.png","Team Liquid Alienware":"assets/logos/team-liquid-alienware.png","Team Secret Whales":"assets/logos/team-secret-whales.png","Top Esports":"assets/logos/top-esports.png"};
function logo(t){var l=LOGOS[t];return l?'<img class="tl" alt="" src="'+l+'">':'';}
var DEF_FAVS=['Karmine Corp','G2 Esports','T1'];
var FAVCOL={'Karmine Corp':'var(--kc)','G2 Esports':'var(--g2)','T1':'var(--t1)'};
var FAV={};
function setFavs(l){FAV={};l.forEach(function(t){FAV[t]=1;});}
function favColor(t){return FAVCOL[t]||'var(--f'+(TEAMS.indexOf(t)%8)+')';}
var NEED={Bo1:1,Bo3:2,Bo5:3};
var SOURCE='Recherche web du 22 oct. 2026 (Wikipédia, Strafe, Dot Esports)';

function U(m,d,h,mi){return new Date(Date.UTC(2026,m-1,d,h,mi||0)).toISOString();}
function buildDefault(){
  var L=[],n=0;

var fmtParts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});

function fromParisInput(v){var m=/^(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(v);if(!m)return null;var t=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5]);var o=parisOffset(t-3600000);t-=o;t=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5])-parisOffset(t);return new Date(t).toISOString();}

function parisDayKey(ms){var p=parisParts(ms),t=Date.UTC(+p.year,+p.month-1,+p.day);if(+p.hour<6)t-=86400000;var d=new Date(t);function z(n){return (n<10?'0':'')+n;}return d.getUTCFullYear()+'-'+z(d.getUTCMonth()+1)+'-'+z(d.getUTCDate());}

var NAMEFIX={'gen.g esports':'Gen.G','los':'Los Grandes','cloud9 kia':'Cloud9 KIA'};
function canon(t){
  if(!t||!t.name||t.name==='TBD'||t.code==='TBD')return null;
  var k=t.name.toLowerCase();
  if(NAMEFIX[k])return NAMEFIX[k];
  for(var i=0;i<TEAMS.length;i++)if(TEAMS[i].toLowerCase()===k)return TEAMS[i];
  return t.name;
}
function applyApi(events){
  var ev=events.filter(function(e){return e.match&&(e.startTime||'')>='2026-10-01';})
    .sort(function(a,b){return a.startTime<b.startTime?-1:a.startTime>b.startTime?1:(a.id<b.id?-1:1);});
  var byBlock=function(n){return ev.filter(function(e){return e.blockName===n;});};
  var ours=state.matches.filter(function(m){return m.stage==='sw';});
  var sw=byBlock('Swiss'),pairs=[];
  for(var i=0;i<Math.min(ours.length,sw.length);i++)pairs.push([ours[i],sw[i]]);
  [['Quarterfinals','QF',4],['Semifinals','SF',2],['Finals','F',1]].forEach(function(b){
    var list=byBlock(b[0]);
    for(var i=0;i<Math.min(b[2],list.length);i++){
      var key=b[2]===1?'F':b[1]+(i+1),m=byKey(key);
      if(m)pairs.push([m,list[i]]);
    }
  });
  pairs.forEach(function(p){
    var m=p[0],e=p[1],am=e.match,t0=am.teams[0],t1=am.teams[1],n0=canon(t0),n1=canon(t1);
    m.t=e.startTime;m.est=false;m.fmt='Bo'+am.strategy.count;m._api=e.state;
    if(n0&&n1){
      delete m.from;m.a=n0;m.b=n1;
      if(e.state!=='unstarted'){m.sa=+(t0.result&&t0.result.gameWins||0);m.sb=+(t1.result&&t1.result.gameWins||0);}
    }
    if(e.state==='inProgress')m.live=true;else delete m.live;
  });
}
function applyOver(){
  state.matches.forEach(function(m){
    var o=over[m.id];if(!o||m._api==='completed')return;
    if('a' in o&&!m.from){m.a=o.a;m.b=o.b;}
    if('sa' in o){m.sa=o.sa;m.sb=o.sb;}
    if(o.t){m.t=o.t;m.est=false;}
    if(o.sa!=null)delete m.live;
  });
}
function rebuild(){
  state.matches=buildDefault();
  if(apiEvents)applyApi(apiEvents);
  applyOver();
}
function loadApi(manual){
  return fetch(API_URL,{headers:{'x-api-key':API_KEY}}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .then(function(j){
      var ev=j&&j.data&&j.data.schedule&&j.data.schedule.events;
      if(!ev)throw new Error('format');
      apiEvents=ev;lastFetch=Date.now();fetchFailed=false;
      try{localStorage.setItem('w26api',JSON.stringify({at:lastFetch,events:ev.filter(function(e){return e.match&&(e.startTime||'')>='2026-10-01';})}));}catch(e){}
      rebuild();render();
    }).catch(function(){fetchFailed=true;renderStatus();});
}

  }).join('');
}
$('favEdit').onclick=function(){drawFavList();$('favDlg').showModal();};
$('favDone').onclick=function(){$('favDlg').close();};
$('favList').addEventListener('change',function(e){
  var t=e.target.value;
  favList=favList.filter(function(x){return x!==t;});
  if(e.target.checked)favList.push(t);
  setFavs(favList);
  try{localStorage.setItem('w26favs',JSON.stringify(favList));}catch(x){}
  render();
});
$('favOnly').addEventListener('change',function(){ui.favOnly=this.checked;try{localStorage.setItem('w26fav',ui.favOnly?'1':'0');}catch(x){}render();});

/* ---- voir le visuel : un clic sur une zone vide masque les cartes ---- */
function setFocus(on){document.body.classList.toggle('focus',on);}
$('eye').onclick=function(e){e.stopPropagation();setFocus(!document.body.classList.contains('focus'));};
document.addEventListener('click',function(e){
  if(e.target.closest('button,a,input,select,label,dialog,.m,.tbl,.fold,.next,.note,.tabs,.favbar,.pager,.foot'))return;
  setFocus(!document.body.classList.contains('focus'));
});
rebuild();render();loadApi();
setInterval(function(){if(!document.hidden)loadApi();},45000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)loadApi();});
})();
</script>
</body>
