<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Worlds 26">

<title>Worlds 2026 Live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: sticky header with tabs, favourite-match banner on top, then day-grouped match list / standings / bracket. */
:root{
  --bg:#f3f4f7; --card:#fff; --ink:#14161a; --muted:#5b6270; --line:#e2e5ea; --soft:#eceef2;
  --accent:#0f6e6a; --accent-ink:#fff; --ok:#177a3c; --bad:#b4281f; --warn:#8a5a00;
  --kc:#2358f0; --g2:#111214; --t1:#d91c2c;
  --sky1:#dfe6ff; --sky2:#f3f4f7; --glow:#2a46e8; --pink:#ff6fd0; --bld:#2a3f9c; --f0:#0f8a5f; --f1:#c2570c; --f2:#7a3fd1; --f3:#c4247a; --f4:#9a6a00; --f5:#0e7490; --f6:#5b6f00; --f7:#8a4b2a;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1014; --card:#171a20; --ink:#eceef2; --muted:#9aa1ad; --line:#272b33; --soft:#20242c;
  --accent:#3fc1b9; --accent-ink:#06201e; --ok:#4cc57a; --bad:#ff7b72; --warn:#e3b341;
  --kc:#6c93ff; --g2:#f1f2f4; --t1:#ff5d6b; --sky1:#040a30; --sky2:#081359; --glow:#3156ff; --pink:#ff6fd0; --bld:#0a1640; --f0:#4cc99a; --f1:#ff9d5c; --f2:#b794ff; --f3:#ff7ac0; --f4:#e3b341; --f5:#4fd1e8; --f6:#b8d85a; --f7:#d9a07c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1014; --card:#171a20; --ink:#eceef2; --muted:#9aa1ad; --line:#272b33; --soft:#20242c;
  --accent:#3fc1b9; --accent-ink:#06201e; --ok:#4cc57a; --bad:#ff7b72; --warn:#e3b341;
  --kc:#6c93ff; --g2:#f1f2f4; --t1:#ff5d6b; --sky1:#040a30; --sky2:#081359; --glow:#3156ff; --pink:#ff6fd0; --bld:#0a1640; --f0:#4cc99a; --f1:#ff9d5c; --f2:#b794ff; --f3:#ff7ac0; --f4:#e3b341; --f5:#4fd1e8; --f6:#b8d85a; --f7:#d9a07c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:760px;width:100%;margin:0 auto;position:relative;flex:1;display:flex;flex-direction:column}
#view{flex:1}
body{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:12px}
/* background: night skyline under a cobalt horizon glow, pink dusk and light spikes (palette from the Worlds 2026 key art, drawn from scratch) */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(55% 30% at 12% 0%,color-mix(in srgb,#8b5cf6 30%,transparent),transparent 70%),
    radial-gradient(60% 24% at 20% 100%,color-mix(in srgb,#4f7bff 55%,transparent),transparent 72%),
    radial-gradient(60% 24% at 85% 100%,color-mix(in srgb,#9b6bff 45%,transparent),transparent 72%),
    linear-gradient(180deg,var(--sky1),var(--sky2))}
.hero{margin-top:4px}
.hero svg{display:block;width:100%;height:auto;max-height:92px;color:var(--ink)}
.favbar{display:flex;gap:10px;align-items:center}
.favbar .btn{padding:5px 10px;font-size:13px}
.favrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--line)}
.favrow input{width:18px;height:18px;accent-color:var(--accent)}
.favrow i{width:12px;height:12px;border-radius:50%;flex:none}
#favList{max-height:60vh;overflow:auto;margin-bottom:8px}
header{gap:8px!important}
h1{background:linear-gradient(90deg,#4f7bff,#b58cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.title::after{content:"";flex-basis:100%;height:3px;border-radius:2px;background:linear-gradient(90deg,#4f7bff,#b58cff)}
h1{font-size:26px!important}
.next{margin-top:8px!important;padding:10px 14px!important;gap:3px!important}
.next .vs{font-size:22px!important}
.count{font-size:28px!important}
.m{padding:8px 12px!important;margin-bottom:6px!important}
.day{margin-top:10px!important}
.pager{margin-bottom:8px!important}
.bg .floor{position:absolute;left:0;right:0;bottom:0;height:34vh;background:var(--img-logo) center bottom/cover no-repeat;-webkit-mask-image:linear-gradient(transparent,#000 55%);mask-image:linear-gradient(transparent,#000 55%)}
.bg .cup{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .5s}
.bg .cup::before{content:"";position:absolute;inset:-60px;background:var(--bgp) center/cover no-repeat;filter:blur(32px) brightness(.7)}
.bg .cup::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:100%;aspect-ratio:941/1672;background:var(--bgp) center/100% 100% no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.bg{background:#050827}
body :is(.sub,#status,.fav-toggle,.pager h2,.pager h2 small){color:#fff;text-shadow:0 1px 8px rgb(0 0 0/.7)}
body h1.logo{background:#fff}
body .btn.ghost{color:#fff;border-color:rgb(255 255 255/.5)}
body .title::after{background:rgb(255 255 255/.6)}
body{--bgp:var(--img-cup);--bgl:var(--img-cup-l)}
body[data-tab="swiss"]{--bgp:var(--img-swiss);--bgl:var(--img-swiss-l)}
body[data-tab="qf"]{--bgp:var(--img-qf-p);--bgl:var(--img-qf)}
body[data-tab="sf"]{--bgp:var(--img-sf-p);--bgl:var(--img-sf)}
body[data-tab="pi"]{--bgp:var(--img-pi-p);--bgl:var(--img-pi)}
@media (orientation:portrait){
  body[data-tab="swiss"] .bg .cup::after{aspect-ratio:2/3}
  body[data-tab="sf"] .bg .cup::after{aspect-ratio:941/1672}
}
.bg .cup{opacity:1}
.bg .floor{opacity:0}
body[data-tab="pi"] .bg .cup{filter:grayscale(1) brightness(.7)}
@media (orientation:landscape){
  .bg .cup::before{display:none}
  .bg .cup::after{left:0;top:0;transform:none;width:100%;height:100%;aspect-ratio:auto;background:var(--bgl) center/cover no-repeat;-webkit-mask-image:none;mask-image:none}
}
h1.logo{width:clamp(180px,56vw,320px);aspect-ratio:1557/364;background:linear-gradient(90deg,var(--ink),color-mix(in srgb,var(--ink) 65%,#8b5cf6));-webkit-mask:var(--img-logomask) center/100% 100% no-repeat;mask:var(--img-logomask) center/100% 100% no-repeat}
.cupbanner{margin-top:8px;border-radius:14px;aspect-ratio:2.4/1;background:var(--img-cup) center 30%/cover no-repeat;position:relative;overflow:hidden}
.cupbanner span{position:absolute;left:14px;bottom:10px;right:14px;color:#fff;font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;text-shadow:0 2px 12px #000}
.cupbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgb(0 0 0/.65))}
.cupbanner span{z-index:1}
.foot{margin-top:auto;padding-top:30px;padding-bottom:6px;font-size:11px;line-height:1.5;text-align:center;display:grid;gap:2px}
.acts{display:flex;gap:8px}
#view,#next,.foot,.favbar,.tabs{transition:opacity .35s}
body.focus :is(#view,#next,.foot){opacity:.07;pointer-events:none}
body.focus :is(.favbar,.tabs){opacity:.45}
body .foot,body .foot #status{color:rgb(255 255 255/.5);text-shadow:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{padding-top:18px;display:flex;flex-direction:column;gap:12px}
.title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font:700 30px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;border-color:color-mix(in srgb,var(--glow) 45%,var(--line));color:var(--muted);padding:5px 10px;font-size:13px;font-weight:500}
.btn.ghost:hover{color:var(--ink);border-color:var(--glow)}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:10px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.fav-toggle{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;cursor:pointer}
.fav-toggle input{width:18px;height:18px;accent-color:var(--accent)}
#status{font-size:13px;color:var(--muted);min-height:18px}
/* next favourite match */
.next{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.next .lbl{font:600 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.next .vs{font:700 26px/1.1 var(--display);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.next .vs i{font-style:normal;color:var(--muted);font-size:18px}
.count{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.next .meta{color:var(--muted);font-size:13px}
/* teams */
.tm{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:1px 6px;margin-left:-6px;font-weight:600}
.tl{width:22px;height:22px;object-fit:contain;background:#0c1030;border-radius:50%;padding:3px;flex:none}
.tm:has(.tl)::before{display:none}
.tm.tbd{color:var(--muted);font-weight:500;font-style:italic}
.tm[data-fav]{background:color-mix(in srgb,var(--fc) 14%,transparent);color:var(--fc)}
.tm[data-fav]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fc);flex:none}
.tm.lose{opacity:.55}
/* match list */
.day{margin-top:22px}
.day h2{font:600 14px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.day h2::after{content:"";flex:1;height:1px;background:var(--line)}
.pager{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pager h2{flex:1;margin:0;justify-content:center;text-align:center;font-size:16px;color:var(--ink);flex-direction:column;gap:0}
.pager h2::after{display:none}
.pager h2 small{font:500 12px var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:24px;line-height:1;display:grid;place-items:center;padding:0 0 3px}
.nav:disabled{opacity:.35;cursor:default}
.fold{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:600 15px var(--body)}
.fold i{font-style:normal;color:var(--muted)}
.fold+.tbl{margin-top:8px}
.note{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--muted);margin:12px 0 0}
.m{display:grid;grid-template-columns:62px 1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.m:hover{border-color:var(--muted)}
.time{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums}
.time small{display:block;font:500 11px var(--body);color:var(--muted);margin-top:3px}
.rows{display:grid;gap:3px;min-width:0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;min-width:0}
.row .n{overflow-wrap:anywhere}
.sc{font:700 18px var(--display);font-variant-numeric:tabular-nums;min-width:16px;text-align:right}
.sc.w{color:var(--ok)}
.tag{font-size:11px;font-weight:600;color:var(--muted);text-align:right;display:grid;gap:3px;justify-items:end}
.pill{border:1px solid var(--line);border-radius:99px;padding:1px 7px;white-space:nowrap}
.pill.done{color:var(--ok);border-color:currentColor}
.pill.live{color:#ff4d5e;border-color:currentColor;font-weight:700}
.pill.est{color:var(--warn);border-color:currentColor}
.empty{color:var(--muted);text-align:center;padding:30px 0}
/* standings */
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:16px}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.st{font-weight:600;font-size:12px}
.st.q{color:var(--ok)} .st.e{color:var(--bad)} .st.p{color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dots b{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots b.w{background:var(--ok)} .dots b.l{background:var(--bad)}
/* bracket */
.scroll{overflow-x:auto;margin-top:16px;padding-bottom:6px}
.bracket{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:18px;min-width:690px}
.col{display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.col h3{font:600 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.col .m{grid-template-columns:1fr;margin:0}
.col .m .when{font-size:12px;color:var(--muted)}
/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(92vw,420px)}
dialog::backdrop{background:rgb(0 0 0/.5)}
dialog h3{font:700 22px var(--display);margin:0 0 12px}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
select,input[type=number],input[type=datetime-local]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 84px;gap:10px;margin-bottom:10px}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
#wallet{border-color:color-mix(in srgb,var(--glow) 70%,transparent);color:#fff;font-weight:700}
#wallet.on{background:linear-gradient(90deg,#4f7bff,#9b6bff);border-color:transparent}
/* telephone : tout tient en largeur, sans defilement lateral */
@media (max-width:560px){
  .hm{display:none}
  table{min-width:0}
  th,td{padding:8px 7px}
  .tm{font-size:14px}
  .tabs{width:100%;gap:2px;padding:2px}
  .tabs button{flex:1 1 auto;padding:7px 3px;font-size:13px}
  .bar{gap:10px}
}
/* paris */
div.m{cursor:pointer}
.betrow{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px;border-top:1px dashed var(--line);margin-top:2px}
.bet{border:0;border-radius:8px;background:linear-gradient(90deg,#4f7bff,#9b6bff);color:#fff;font-weight:700;font-size:13px;padding:5px 14px}
.odds{font-size:12px;color:var(--muted)}
.bchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px 2px 3px;background:var(--soft);color:var(--ink)}
.bchip .tl{width:18px;height:18px;padding:2px}
.bchip.won{color:var(--ok)} .bchip.lost{color:var(--bad)} .bchip.void{color:var(--muted)}
#wallet{font-variant-numeric:tabular-nums}
.wcard{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.wl{font:600 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wbig{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#4f7bff,#b58cff);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.wsub{font-size:13px;color:var(--muted)}
.brow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px;display:grid;gap:3px}
.btop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bsub{font-size:12px;color:var(--muted)}
.bres{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.bres.won{color:var(--ok)} .bres.lost{color:var(--bad)} .bres.open,.bres.void{color:var(--muted);font-size:14px}
.bteams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bteam{display:grid;justify-items:center;gap:6px;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 6px;font-weight:700;font-size:14px;text-align:center}
.bteam .tl{width:40px;height:40px;padding:5px}
.bteam.on{border-color:var(--glow);background:color-mix(in srgb,var(--glow) 12%,var(--bg))}
.presets{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.presets .btn{padding:5px 10px;font-size:13px}
.bteam small{font-weight:500;color:var(--muted);font-size:12px}
tr.me td{background:color-mix(in srgb,var(--glow) 14%,transparent)}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-width:0}
.kinds{display:flex;gap:6px;margin-bottom:10px}
.kind{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 4px;font-weight:600;font-size:13px}
.kind.on{border-color:var(--glow);background:color-mix(in srgb,var(--glow) 14%,var(--bg))}
.bopts{display:grid;gap:6px;max-height:34vh;overflow-y:auto;margin-bottom:12px}
.bopt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;text-align:left;font-weight:600;font-size:14px}
.bopt b{font:700 17px var(--display);font-variant-numeric:tabular-nums}
.bopt.on{border-color:var(--glow);background:color-mix(in srgb,var(--glow) 12%,var(--bg))}
.blab{font-size:13px;margin-left:4px}
.bnote{font-size:12px;color:var(--muted);margin-top:8px}
.bwin{font-weight:700;margin-top:6px;min-height:20px}
.bmsg{font-size:12px;color:var(--bad);min-height:18px}
@media (prefers-reduced-motion:no-preference){.m{transition:border-color .15s}}
</style>
<style>
:root{--img-logo:url(assets/img-logo.webp);--img-cup:url(assets/img-cup.webp)}
</style>
<style>:root{--img-logomask:url(assets/img-logomask.png)}</style>
<style>:root{--img-swiss:url(assets/img-swiss.webp)}</style>
<style>:root{--img-swiss-l:url(assets/img-swiss-l.webp)}</style>
<style>:root{--img-qf:url(assets/img-qf.webp)}</style>
<style>:root{--img-qf-p:url(assets/img-qf-p.webp)}</style>
<style>:root{--img-sf:url(assets/img-sf.webp)}</style>
<style>:root{--img-sf-p:url(assets/img-sf-p.webp)}</style>

<body>
<div class="bg" aria-hidden="true"><div class="cup"></div><div class="floor"></div>
</div>
<div class="wrap">
<header>
  <div class="title">
    <div><h1 class="logo" role="img" aria-label="Worlds 2026"></h1></div>
    <span class="acts"><button class="btn ghost" id="wallet" aria-label="Mes jetons">1 000 jetons</button><button class="btn ghost" id="eye" title="Afficher ou masquer les cartes pour voir le visuel">Visuel</button><button class="btn ghost" id="refresh">Actualiser</button></span>
  </div>
  <div class="bar">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-t="pi" aria-selected="false">Play-in</button>
      <button role="tab" data-t="swiss" aria-selected="true">Suisse</button>
      <button role="tab" data-t="qf" aria-selected="false">Quarts</button>
      <button role="tab" data-t="sf" aria-selected="false">Demies</button>
      <button role="tab" data-t="f" aria-selected="false">Finale</button>
    </div>
    <div class="favbar"><label class="fav-toggle"><input type="checkbox" id="favOnly"> Mes favoris uniquement</label><button class="btn" id="favEdit">Choisir</button></div>
  </div>
</header>
<div id="next"></div>
<main id="view"></main>
<footer class="foot"><div>Heures affichées en heure de Paris · Allen (Texas) puis Brooklyn</div><div id="status" role="status"></div><div>Données : API publique de lolesports.com · Site de fan non officiel, sans but commercial. Worlds 2026, le logo et les visuels appartiennent à Riot Games.</div></footer>
</div>

<dialog id="betDlg">
  <form method="dialog" id="betForm">
    <h3 id="betTitle">Parier</h3>
    <div id="betKinds" class="kinds"></div>
    <div id="betOpts"></div>
    <label>Mise (jetons)<input type="number" id="betStake" min="10" step="10" inputmode="numeric"></label>
    <div id="betPresets" class="presets"><button type="button" class="btn" data-v="50">50</button><button type="button" class="btn" data-v="100">100</button><button type="button" class="btn" data-v="250">250</button><button type="button" class="btn" data-v="500">500</button><button type="button" class="btn" data-v="max">Tout</button></div>
    <div class="bnote" id="betBal"></div>
    <div class="bwin" id="betWin"></div>
    <div class="bmsg" id="betMsg"></div>
    <div class="actions" style="justify-content:flex-end"><button type="button" class="btn" id="betCancel">Annuler</button><button type="submit" class="btn primary" id="betOk">Valider le pari</button></div>
  </form>
</dialog>
<dialog id="favDlg">
  <h3>Mes équipes favorites</h3>
  <div id="favList"></div>
  <div class="actions" style="justify-content:flex-end"><button class="btn primary" id="favDone">Terminé</button></div>
</dialog>
<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlgTitle">Match</h3>
    <div class="grid2"><label>Équipe 1<select id="fA"></select></label><label>Score<input type="number" id="fSA" min="0" max="9" inputmode="numeric"></label></div>
    <div class="grid2"><label>Équipe 2<select id="fB"></select></label><label>Score<input type="number" id="fSB" min="0" max="9" inputmode="numeric"></label></div>
    <label>Date et heure (Paris)<input type="datetime-local" id="fT"></label>
    <div class="actions">
      <button type="button" class="btn" id="fClear">Rétablir le score officiel</button>
      <span style="display:flex;gap:8px"><button type="button" class="btn" id="fCancel">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></span>
    </div>
  </form>
</dialog>

<script>
(function(){
'use strict';
var TEAMS=['Gen.G','Anyone\'s Legend','Team Liquid Alienware','G2 Esports','Team Secret Whales','Los Grandes','Hanwha Life Esports','Bilibili Gaming','LYON','Movistar KOI','T1','Top Esports','CTBC Flying Oyster','Invictus Gaming','Dplus KIA','Karmine Corp'];
var LOGOS={"Anyone's Legend":"assets/logos/anyone-s-legend.png","Bilibili Gaming":"assets/logos/bilibili-gaming.png","CTBC Flying Oyster":"assets/logos/ctbc-flying-oyster.png","Cloud9 KIA":"assets/logos/cloud9-kia.png","Dplus KIA":"assets/logos/dplus-kia.png","FURIA":"assets/logos/furia.png","G2 Esports":"assets/logos/g2-esports.png","Gen.G":"assets/logos/gen-g.png","Hanwha Life Esports":"assets/logos/hanwha-life-esports.png","Invictus Gaming":"assets/logos/invictus-gaming.png","Karmine Corp":"assets/logos/karmine-corp.png","LYON":"assets/logos/lyon.png","Los Grandes":"assets/logos/los-grandes.png","MVK Esports":"assets/logos/mvk-esports.png","Movistar KOI":"assets/logos/movistar-koi.png","T1":"assets/logos/t1.png","Team Liquid Alienware":"assets/logos/team-liquid-alienware.png","Team Secret Whales":"assets/logos/team-secret-whales.png","Top Esports":"assets/logos/top-esports.png"};
function logo(t){var l=LOGOS[t];return l?'<img class="tl" alt="" src="'+l+'">':'';}
var DEF_FAVS=['Karmine Corp','G2 Esports','T1'];
var FAVCOL={'Karmine Corp':'var(--kc)','G2 Esports':'var(--g2)','T1':'var(--t1)'};
var FAV={};
function setFavs(l){FAV={};l.forEach(function(t){FAV[t]=1;});}
function favColor(t){return FAVCOL[t]||'var(--f'+(TEAMS.indexOf(t)%8)+')';}
var NEED={Bo1:1,Bo3:2,Bo5:3};
var SOURCE='Recherche web du 22 oct. 2026 (Wikipédia, Strafe, Dot Esports)';

function U(m,d,h,mi){return new Date(Date.UTC(2026,m-1,d,h,mi||0)).toISOString();}
function buildDefault(){
  var L=[],n=0;
  function add(o){o.id='m'+(++n);L.push(o);}
  var pi=[['2026-10-15','Cloud9 KIA','Karmine Corp',2,3],['2026-10-15','FURIA','MVK Esports',0,3],['2026-10-16','Karmine Corp','MVK Esports',3,0],['2026-10-16','Cloud9 KIA','FURIA',1,3],['2026-10-17','MVK Esports','FURIA',3,1],['2026-10-18','Karmine Corp','MVK Esports',3,0]];
  pi.forEach(function(p){add({stage:'pi',label:'Play-in',day:p[0],a:p[1],b:p[2],sa:p[3],sb:p[4],fmt:'Bo5'});});
  var r1=[['Gen.G','Invictus Gaming'],['Hanwha Life Esports','Top Esports'],['Bilibili Gaming','Movistar KOI'],['Anyone\'s Legend','Karmine Corp'],['G2 Esports','Dplus KIA'],['Team Liquid Alienware','CTBC Flying Oyster'],['Los Grandes','T1'],['Team Secret Whales','LYON']];
  r1.forEach(function(p,i){add({stage:'sw',round:1,label:'Suisse · Ronde 1',t:U(10,23,17+i),a:p[0],b:p[1],fmt:'Bo1'});});
  function slots(round,label,fmt,plan){plan.forEach(function(pl){for(var i=0;i<pl[2];i++)add({stage:'sw',round:round,label:label,t:U(10,pl[0],pl[1]+i),est:true,a:null,b:null,fmt:fmt});});}
  slots(2,'Suisse · Ronde 2','Bo1',[[24,17,8]]);
  slots(3,'Suisse · Ronde 3','Bo3',[[25,17,4],[26,17,4]]);
  slots(4,'Suisse · Ronde 4','Bo3',[[28,20,2],[29,20,2],[30,20,2]]);
  slots(5,'Suisse · Ronde 5','Bo3',[[31,17,3]]);
  var q=[],names=['Quart 1','Quart 2','Quart 3','Quart 4'];
  names.forEach(function(nm,i){add({stage:'ko',key:'QF'+(i+1),label:nm,t:U(11,3+i,22),est:true,a:null,b:null,fmt:'Bo5'});});
  add({stage:'ko',key:'SF1',label:'Demi-finale 1',t:U(11,7,22),est:true,from:['QF1','QF2'],fmt:'Bo5'});
  add({stage:'ko',key:'SF2',label:'Demi-finale 2',t:U(11,8,22),est:true,from:['QF3','QF4'],fmt:'Bo5'});
  add({stage:'ko',key:'F',label:'Finale · Barclays Center, Brooklyn',t:U(11,14,19),from:['SF1','SF2'],fmt:'Bo5'});
  return L;
}

var API_URL='https://esports-api.lolesports.com/persisted/gw/getSchedule?hl=en-US&leagueId=98767975604431411';
var API_KEY='0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z';   /* cle publique utilisee par lolesports.com */
var state={matches:buildDefault()};
var apiEvents=null,lastFetch=null,fetchFailed=false,over={};
var ui={tab:'swiss',favOnly:false,day:{},fold:true};
var favList=DEF_FAVS.slice();
try{var sfv=JSON.parse(localStorage.getItem('w26favs')||'null');if(sfv&&sfv.length!=null)favList=sfv.filter(function(t){return TEAMS.indexOf(t)>=0;});}catch(e){}
setFavs(favList);
var editing=null;

try{ui.favOnly=localStorage.getItem('w26fav')==='1';ui.fold=localStorage.getItem('w26fold')!=='0';ui.tab=localStorage.getItem('w26tab')||'swiss';
  var so=localStorage.getItem('w26over');if(so)over=JSON.parse(so)||{};
  var sa=localStorage.getItem('w26api');if(sa){var pa=JSON.parse(sa);if(pa&&pa.events){apiEvents=pa.events;lastFetch=pa.at;}}}catch(e){}

var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---- Paris time ---- */
var fmtParts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
function parisParts(ms){var o={};fmtParts.formatToParts(new Date(ms)).forEach(function(p){o[p.type]=p.value;});return o;}
function parisOffset(ms){var p=parisParts(ms);return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute)-Math.floor(ms/60000)*60000;}
function toParisInput(iso){var p=parisParts(Date.parse(iso));return p.year+'-'+p.month+'-'+p.day+'T'+p.hour+':'+p.minute;}
function fromParisInput(v){var m=/^(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(v);if(!m)return null;var t=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5]);var o=parisOffset(t-3600000);t-=o;t=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5])-parisOffset(t);return new Date(t).toISOString();}
var fDay=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',weekday:'long',day:'numeric',month:'long'});
var fHour=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit'});
var fShort=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function parisDayKey(ms){var p=parisParts(ms),t=Date.UTC(+p.year,+p.month-1,+p.day);if(+p.hour<6)t-=86400000;var d=new Date(t);function z(n){return (n<10?'0':'')+n;}return d.getUTCFullYear()+'-'+z(d.getUTCMonth()+1)+'-'+z(d.getUTCDate());}
function isNight(m){return !!m.t&&+parisParts(Date.parse(m.t)).hour<6;}
function dayKey(m){if(m.t)return parisDayKey(Date.parse(m.t));return m.day||'9999';}

/* ---- match logic ---- */
function byKey(k){return state.matches.filter(function(m){return m.key===k;})[0];}
function winner(m){
  if(m.sa==null||m.sb==null||m.sa===''||m.sb==='')return null;
  var need=NEED[m.fmt]||1,t=teams(m);
  if(m.sa>=need&&m.sa>m.sb)return t[0]||'?';
  if(m.sb>=need&&m.sb>m.sa)return t[1]||'?';
  return null;
}
function teams(m){
  if(m.from)return m.from.map(function(k){var s=byKey(k);var w=s&&winner(s);return w&&w!=='?'?w:null;});
  return [m.a||null,m.b||null];
}
function hasFav(m){return teams(m).some(function(t){return t&&FAV[t];});}
function teamHtml(t,lose){
  if(!t)return '<span class="tm tbd">À déterminer</span>';
  var f=FAV[t];
  return '<span class="tm'+(lose?' lose':'')+'"'+(f?' data-fav="1" style="--fc:'+favColor(t)+'"':'')+'>'+logo(t)+esc(t)+'</span>';
}
function matchCard(m){
  var t=teams(m),w=winner(m),done=!!w;
  var sa=m.sa==null?'':m.sa,sb=m.sb==null?'':m.sb;
  var time=m.t?fHour.format(new Date(m.t)):'—';
  var sm=m.t?'':'';
  var pill=m.live?'<span class="pill live">En direct</span>':(done?'<span class="pill done">Terminé</span>':(m.est?'<span class="pill est">Horaire estimé</span>':''));
  return '<div class="m" data-id="'+m.id+'" role="button" tabindex="0" aria-label="Modifier le match">'+
    '<div class="time">'+time+'<small>'+esc(m.t?(isNight(m)?'dans la nuit':''):'date seule')+'</small></div>'+
    '<div class="rows"><div class="row"><span class="n">'+teamHtml(t[0],done&&w!==t[0])+'</span><span class="sc'+(done&&w===t[0]?' w':'')+'">'+esc(sa)+'</span></div>'+
    '<div class="row"><span class="n">'+teamHtml(t[1],done&&w!==t[1])+'</span><span class="sc'+(done&&w===t[1]?' w':'')+'">'+esc(sb)+'</span></div></div>'+
    '<div class="tag"><span>'+esc(m.label)+'</span><span class="pill">'+esc(m.fmt)+'</span>'+pill+'</div>'+betHtml(m)+'</div>';
}
function sorted(){
  return state.matches.slice().sort(function(a,b){return (a.t||a.day+'T00:00:00Z').localeCompare(b.t||b.day+'T00:00:00Z');});
}

/* ---- views ---- */
function inTab(m,tab){
  if(tab==='pi')return m.stage==='pi';
  if(tab==='swiss')return m.stage==='sw';
  if(tab==='qf')return m.key&&m.key.indexOf('QF')===0;
  if(tab==='sf')return m.key&&m.key.indexOf('SF')===0;
  if(tab==='f')return m.key==='F';
  return true;
}
function renderCal(){
  var list=sorted().filter(function(m){return inTab(m,ui.tab)&&(!ui.favOnly||hasFav(m));});
  if(!list.length)return '<div class="empty">Aucun match de tes favoris pour l\'instant.</div>';
  var groups={},keys=[];
  list.forEach(function(m){var k=dayKey(m);if(!groups[k]){groups[k]=[];keys.push(k);}groups[k].push(m);});
  if(ui.tab==='qf'||ui.tab==='sf'||ui.tab==='f'){
    return keys.map(function(k){
      var f=groups[k][0],d=new Date(k+'T12:00:00Z');
      return '<section class="day"><div class="pager"><h2>'+esc(fDay.format(d))+'</h2></div>'+groups[k].map(matchCard).join('')+'</section>';
    }).join('');
  }
  var cur=ui.day[ui.tab];
  if(keys.indexOf(cur)<0){
    var today=parisDayKey(Date.now());
    cur=keys.filter(function(k){return k>=today;})[0]||keys[keys.length-1];
    ui.day[ui.tab]=cur;
  }
  var i=keys.indexOf(cur),first=groups[cur][0];
  var d=new Date(cur+'T12:00:00Z');
  var out='<section class="day"><div class="pager"><button class="nav" data-act="prev" aria-label="Jour précédent"'+(i===0?' disabled':'')+'>&#8249;</button>'+
    '<h2>'+esc(fDay.format(d))+'<small>'+(i+1)+' / '+keys.length+'</small></h2>'+
    '<button class="nav" data-act="next" aria-label="Jour suivant"'+(i===keys.length-1?' disabled':'')+'>&#8250;</button></div>';
  if(cur==='2026-10-25')out+='<div class="note">Passage à l\'heure d\'hiver en France cette nuit : les horaires sont décalés d\'une heure par rapport aux jours précédents.</div>';
  if(cur==='2026-11-01')out+='<div class="note">Passage à l\'heure d\'hiver aux États-Unis : l\'écart avec Paris passe à 6 h.</div>';
  groups[cur].forEach(function(m){out+=matchCard(m);});
  return out+'</section>';
}
function standings(){
  var rec={};TEAMS.forEach(function(t){rec[t]={t:t,w:0,l:0,h:[]};});
  sorted().filter(function(m){return m.stage==='sw';}).forEach(function(m){
    var w=winner(m);if(!w||w==='?')return;
    var tt=teams(m),l=tt[0]===w?tt[1]:tt[0];
    if(rec[w]){rec[w].w++;rec[w].h.push('w');}
    if(l&&rec[l]){rec[l].l++;rec[l].h.push('l');}
  });
  return Object.keys(rec).map(function(k){return rec[k];}).sort(function(a,b){return (b.w-b.l)-(a.w-a.l)||b.w-a.w||a.l-b.l||a.t.localeCompare(b.t);});
}
function renderSwiss(){
  var rows=standings().filter(function(r){return !ui.favOnly||FAV[r.t];});
  var h='<button class="fold" data-act="fold" aria-expanded="'+(!ui.fold)+'"><span>Classement de la phase suisse</span><i>'+(ui.fold?'&#9662;':'&#9652;')+'</i></button>';
  if(ui.fold)return h;
  h+='<div class="tbl"><table><thead><tr><th>Équipe</th><th class="c">V-D</th><th class="hm">Parcours</th><th>Statut</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var st=r.w>=3?'<span class="st q">Qualifiée</span>':r.l>=3?'<span class="st e">Éliminée</span>':'<span class="st p">En course</span>';
    var dots='<span class="dots">'+r.h.map(function(x){return '<b class="'+x+'"></b>';}).join('')+'</span>';
    h+='<tr><td>'+teamHtml(r.t)+'</td><td class="c"><b>'+r.w+'-'+r.l+'</b></td><td class="hm">'+dots+'</td><td>'+st+'</td></tr>';
  });
  return h+'</tbody></table></div><p class="note">Qualifiée à 3 victoires, éliminée à 3 défaites. Tirage du premier tour fait le 18 octobre. Les affiches des rondes suivantes se complètent au fil de la phase.</p>';
}
function renderKo(){
  function col(title,keys){return '<div class="col"><h3>'+title+'</h3>'+keys.map(function(k){var m=byKey(k);return koCard(m);}).join('')+'</div>';}
  return '<div class="scroll"><div class="bracket">'+col('Quarts · Allen',['QF1','QF2','QF3','QF4'])+col('Demies · Allen',['SF1','SF2'])+col('Finale · Brooklyn',['F'])+'</div></div>'+
    '<p class="note">Le tirage des quarts a lieu après la phase suisse : touche un quart pour choisir les équipes. Les vainqueurs avancent seuls dans l\'arbre.</p>';
}
function koCard(m){
  var t=teams(m),w=winner(m),done=!!w;
  var when=m.t?fShort.format(new Date(m.t))+(m.est?' (estimé)':''):'';
  return '<div class="m" data-id="'+m.id+'" role="button" tabindex="0">'+
    '<div class="rows"><div class="row"><span class="n">'+teamHtml(t[0],done&&w!==t[0])+'</span><span class="sc'+(done&&w===t[0]?' w':'')+'">'+esc(m.sa==null?'':m.sa)+'</span></div>'+
    '<div class="row"><span class="n">'+teamHtml(t[1],done&&w!==t[1])+'</span><span class="sc'+(done&&w===t[1]?' w':'')+'">'+esc(m.sb==null?'':m.sb)+'</span></div></div>'+
    '<div class="when">'+esc(m.label)+' · '+esc(m.fmt)+'<br>'+esc(when)+'</div>'+betHtml(m)+'</div>';
}
function render(){
  if(['pi','swiss','qf','sf','f','bets'].indexOf(ui.tab)<0)ui.tab='swiss';
  var intro={qf:'Le tirage des quarts a lieu après la phase suisse : touche un quart pour choisir les équipes.',sf:'Les finalistes sont les vainqueurs des quarts : ils avancent automatiquement.',f:'Finale au Barclays Center, Brooklyn. Les finalistes sont les vainqueurs des demies.'}[ui.tab];
  document.body.setAttribute('data-tab',ui.tab);
  $('view').innerHTML=ui.tab==='bets'?renderBets():(ui.tab==='swiss'?renderSwiss():'')+(intro?'<p class="note">'+intro+'</p>':'')+renderCal();
  renderWallet();
  Array.prototype.forEach.call($('tabs').children,function(b){b.setAttribute('aria-selected',b.dataset.t===ui.tab);});
  $('favOnly').checked=ui.favOnly;
  renderNext();renderStatus();
}

/* ---- next favourite match ---- */
function nextFav(){
  var now=Date.now();
  var c=sorted().filter(function(m){return m.t&&!winner(m)&&hasFav(m)&&Date.parse(m.t)>now-3*3600e3;});
  return c[0]||null;
}
function renderNext(){
  var m=nextFav(),el=$('next');
  if(!m){el.innerHTML='';return;}
  var t=teams(m);
  el.innerHTML='<div class="next"><div class="lbl">Prochain match de tes favoris</div><div class="vs">'+teamHtml(t[0])+'<i>vs</i>'+teamHtml(t[1])+'</div>'+
    '<div class="count" id="count"></div><div class="meta">'+esc(fShort.format(new Date(m.t)))+' · '+esc(m.label)+' · '+esc(m.fmt)+(m.est?' · horaire estimé':'')+'</div></div>';
  tick();
}
function tick(){
  var m=nextFav(),el=$('count');if(!m||!el)return;
  var d=Date.parse(m.t)-Date.now();
  if(d<=0){el.textContent=m.live?'En direct':'En cours ou imminent';return;}
  var s=Math.floor(d/1000),dd=Math.floor(s/86400),h=Math.floor(s%86400/3600),mi=Math.floor(s%3600/60),ss=s%60;
  function z(n){return (n<10?'0':'')+n;}
  el.textContent=(dd?dd+' j ':'')+z(h)+':'+z(mi)+':'+z(ss);
}
setInterval(tick,1000);setInterval(renderNext,60000);

/* ---- donnees officielles (API lolesports.com) ---- */
var NAMEFIX={'gen.g esports':'Gen.G','los':'Los Grandes','cloud9 kia':'Cloud9 KIA'};
function canon(t){
  if(!t||!t.name||t.name==='TBD'||t.code==='TBD')return null;
  var k=t.name.toLowerCase();
  if(NAMEFIX[k])return NAMEFIX[k];
  for(var i=0;i<TEAMS.length;i++)if(TEAMS[i].toLowerCase()===k)return TEAMS[i];
  return t.name;
}
function applyApi(events){
  var ev=events.filter(function(e){return e.match&&(e.startTime||'')>='2026-10-01';})
    .sort(function(a,b){return a.startTime<b.startTime?-1:a.startTime>b.startTime?1:(a.id<b.id?-1:1);});
  var byBlock=function(n){return ev.filter(function(e){return e.blockName===n;});};
  var ours=state.matches.filter(function(m){return m.stage==='sw';});
  var sw=byBlock('Swiss'),pairs=[];
  for(var i=0;i<Math.min(ours.length,sw.length);i++)pairs.push([ours[i],sw[i]]);

/* ---- cotes : force des equipes (ratings.json) -> probabilite -> cote ---- */
var RAT=null,RCACHE=null,MARGIN=0.95,K_LIVE=0.15,TEMP=0.8;
function ratingsNow(){
  if(!RAT)return null;
  if(RCACHE)return RCACHE;
  var R={};Object.keys(RAT.teams).forEach(function(t){R[t]=RAT.teams[t].r;});
  sorted().filter(function(m){return (m.stage==='sw'||m.stage==='ko')&&m.t&&m.t>RAT.asOf&&m.a&&m.b&&winner(m);}).forEach(function(m){
    if(R[m.a]==null||R[m.b]==null)return;
    var n=(m.sa||0)+(m.sb||0),p=1/(1+Math.exp(-(R[m.a]-R[m.b]))),d=K_LIVE*((m.sa||0)-n*p);
    R[m.a]+=d;R[m.b]-=d;
  });
  return RCACHE=R;
}
function seriesP(pg,fmt){
  var need=NEED[fmt]||1,q=1-pg,s=0,c=1;
  for(var k=0;k<need;k++){
    if(k>0)c=c*(need-1+k)/k;
    s+=c*Math.pow(pg,need)*Math.pow(q,k);
  }
  return s;
}
function winProb(a,b,fmt){
  var R=ratingsNow();if(!R||R[a]==null||R[b]==null)return null;
  return seriesP(1/(1+Math.exp(-TEMP*(R[a]-R[b]))),fmt);
}
function oddsFor(m){
  var t=teams(m),p=t[0]&&t[1]?winProb(t[0],t[1],m.fmt):null;
  if(p==null)return [1.9,1.9];
  function c(x){return Math.max(1.05,Math.min(8,Math.round(MARGIN/x*100)/100));}
  return [c(p),c(1-p)];
}
function fmtO(x){return x.toFixed(2).replace('.',',');}
function loadRatings(){
  fetch('ratings.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(j){RAT=j;RCACHE=null;render();}).catch(function(){});
}

var ABBR={'Gen.G':'GEN',"Anyone's Legend":'AL','Team Liquid Alienware':'TL','G2 Esports':'G2','Team Secret Whales':'TSW','Los Grandes':'LOS','Hanwha Life Esports':'HLE','Bilibili Gaming':'BLG','LYON':'LYON','Movistar KOI':'KOI','T1':'T1','Top Esports':'TES','CTBC Flying Oyster':'CFO','Invictus Gaming':'IG','Dplus KIA':'DK','Karmine Corp':'KC'};

/* sequences de games : 'A' = premiere equipe de la carte, 'B' = seconde */
function allSeqs(need){var out=[];(function go(s,a,b){if(a===need||b===need){out.push(s);return;}go(s+'A',a+1,b);go(s+'B',a,b+1);})('',0,0);return out;}
function seqProb(s,pg){var p=1;for(var i=0;i<s.length;i++)p*=s.charAt(i)==='A'?pg:1-pg;return p;}
function scoreKey(a,b){return a>b?'A'+a+'-'+b:'B'+b+'-'+a;}
function seqScore(s){var a=(s.match(/A/g)||[]).length;return scoreKey(a,s.length-a);}
function pGame(m){
  var t=teams(m),R=ratingsNow();
  if(!R||R[t[0]]==null||R[t[1]]==null)return 0.5;
  return 1/(1+Math.exp(-TEMP*(R[t[0]]-R[t[1]])));
}
function co(p,max){return Math.max(1.05,Math.min(max,Math.round(MARGIN/Math.max(p,1e-6)*100)/100));}
function betOptions(m,kind){
  var t=teams(m),need=NEED[m.fmt]||1,pg=pGame(m);
  if(kind==='winner'){var o=oddsFor(m);return [{key:'A',label:'Vainqueur : '+t[0],odds:o[0],team:t[0]},{key:'B',label:'Vainqueur : '+t[1],odds:o[1],team:t[1]}];}
  var seqs=allSeqs(need),out=[];
  if(kind==='score'){
    var P={};seqs.forEach(function(s){var k=seqScore(s);P[k]=(P[k]||0)+seqProb(s,pg);});
    var keys=[],j;
    for(j=0;j<need;j++)keys.push('A'+need+'-'+j);
    for(j=need-1;j>=0;j--)keys.push('B'+need+'-'+j);
    keys.forEach(function(k){out.push({key:k,label:'Score : '+ab(t[k.charAt(0)==='A'?0:1])+' '+k.slice(1),short:ab(t[k.charAt(0)==='A'?0:1])+' '+k.slice(1),odds:co(P[k],50)});});
    return out;
  }
  seqs.forEach(function(s){
    var names=s.split('').map(function(c){return ab(t[c==='A'?0:1]);}).join(' → ');
    out.push({key:s,label:'Déroulé : '+names,short:names,odds:co(seqProb(s,pg),80),p:seqProb(s,pg)});
  });
  out.sort(function(x,y){return y.p-x.p;});
  return out;
}

/* resultat reel du deroule : games enregistrees, ou deduites d'un 2-0 / 3-0 */
function actualSeq(b,m){
  var n=(m.sa||0)+(m.sb||0),recs=gameRes[m.mid||''];
  if(recs&&n){
    var s='',ok=true;
    for(var i=0;i<n;i++){var w=recs[i];if(!w){ok=false;break;}s+=w===b.a?'A':(w===b.b?'B':'?');}
    if(ok&&s.indexOf('?')<0)return s;
  }
  if((m.sa||0)===0)return new Array(n+1).join('B');
  if((m.sb||0)===0)return new Array(n+1).join('A');
  return null;
}
function resolveBets(){
  var changed=false;
  wallet.bets.forEach(function(b){
    if(b.status!=='open')return;
    var m=state.matches.filter(function(x){return x.id===b.matchId;})[0];if(!m)return;
    var t=teams(m),kind=b.kind||'winner';
    if(kind==='winner'?t.indexOf(b.team)<0:(t[0]!==b.a||t[1]!==b.b)){b.status='void';b.payout=b.stake;wallet.balance+=b.stake;changed=true;return;}
    var w=winner(m);if(!w||w==='?')return;
    var won;
    if(kind==='winner')won=(w===b.team);
    else if(kind==='score')won=(scoreKey(m.sa,m.sb)===b.key);
    else{
      var s=actualSeq(b,m);
      if(s==null){
        if(m.t&&Date.now()-Date.parse(m.t)>8*3600e3){b.status='void';b.payout=b.stake;wallet.balance+=b.stake;changed=true;}
        return;
      }
      won=(s===b.key);
    }
    if(won){b.status='won';b.payout=Math.round(b.stake*b.odds);wallet.balance+=b.payout;}
    else{b.status='lost';b.payout=0;}
    changed=true;
  });

}

/* ---- enregistrement des games (deduites des changements de score pendant les matchs) ---- */
function trackGames(oldEv,newEv){
  if(!oldEv)return;
  var prev={};
  oldEv.forEach(function(e){if(e.match&&e.match.id)prev[e.match.id]=e.match.teams.map(function(t){return (t.result&&t.result.gameWins)||0;});});
  var changed=false;
  newEv.forEach(function(e){
    var am=e.match;if(!am||!prev[am.id])return;
    var o=prev[am.id],n=am.teams.map(function(t){return (t.result&&t.result.gameWins)||0;});
    var to=o[0]+o[1],tn=n[0]+n[1];
    if(tn!==to+1)return;
    var w=canon(n[0]>o[0]?am.teams[0]:am.teams[1]);
    var arr=gameRes[am.id]=gameRes[am.id]||[];
    if(!arr[tn-1]){arr[tn-1]=w;changed=true;pushGame(am.id,tn,w);}
  });
  if(changed)saveG();
}
function pushGame(mid,no,w){if(lbOn)sbCall('record_game',{p_match:mid,p_game:no,p_winner:w}).catch(function(){});}
function pullGames(){
  if(!lbOn)return;
  var mids=wallet.bets.filter(function(b){return b.status==='open'&&b.kind==='seq'&&b.mid;}).map(function(b){return b.mid;});
  if(!mids.length)return;
  sbCall('get_games',{p_matches:mids}).then(function(rows){
    var ch=false;
    (rows||[]).forEach(function(r){var a=gameRes[r.match_id]=gameRes[r.match_id]||[];if(!a[r.game_no-1]){a[r.game_no-1]=r.winner;ch=true;}});
    if(ch){saveG();resolveBets();render();}
  }).catch(function(){});
}

function rnd(){var a=new Uint8Array(16);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
function newId(){var h=rnd();return h.slice(0,8)+'-'+h.slice(8,12)+'-4'+h.slice(13,16)+'-a'+h.slice(17,20)+'-'+h.slice(20,32);}

function pushScore(now){
  if(!lbOn||!prof)return Promise.resolve();
  clearTimeout(syncTimer);
  var run=function(){
    var c=betCounts();
    return sbCall('upsert_player',{p_id:prof.id,p_token:prof.token,p_league:prof.league,p_pseudo:prof.pseudo,p_balance:Math.max(0,Math.min(1000000,Math.round(wallet.balance))),p_engaged:Math.min(1000000,c.eng),p_won:Math.min(10000,c.won),p_lost:Math.min(10000,c.lost)})
      .then(function(){lbErr='';return loadBoard();}).catch(function(e){lbErr=e.message==='pseudo_pris'?'Ce pseudo est déjà pris dans cette ligue.':'Classement indisponible pour le moment.';if(ui.tab==='bets')render();throw e;});
  };
  if(now)return run();
  syncTimer=setTimeout(function(){run().catch(function(){});},1200);
  return Promise.resolve();
}
function loadBoard(){
  if(!lbOn||!prof)return Promise.resolve();
  return sbCall('get_leaderboard',{p_league:prof.league}).then(function(rows){lbRows=rows;if(ui.tab==='bets')render();}).catch(function(){lbErr='Classement indisponible pour le moment.';});
}
function renderLeague(){
  if(!lbOn)return '';
  var h='<section class="day"><h2>Classement entre amis</h2>';
  if(!prof){
    return h+'<div class="wcard"><div class="wsub">Crée ou rejoins une ligue : tes amis tapent le même code que toi.</div>'+
      '<label>Ton pseudo<input type="text" id="lbPseudo" maxlength="20" autocomplete="off" placeholder="ex : Benoit"></label>'+
      '<label>Code de la ligue (3 à 20 lettres ou chiffres)<input type="text" id="lbLeague" maxlength="20" autocomplete="off" autocapitalize="none" placeholder="ex : fratrie26"></label>'+
      (lbErr?'<div class="bmsg">'+esc(lbErr)+'</div>':'')+
      '<button class="btn primary" data-act="lbjoin">Rejoindre</button></div></section>';
  }
  h+='<div class="wsub" style="margin-bottom:8px">Ligue <b>'+esc(prof.league)+'</b> · tu joues sous le nom <b>'+esc(prof.pseudo)+'</b>. Donne ce code à tes amis.</div>';
  if(lbRows&&lbRows.length){
    h+='<div class="tbl"><table><thead><tr><th>#</th><th>Joueur</th><th class="c">Jetons</th><th class="c">V-D</th></tr></thead><tbody>'+
      lbRows.map(function(r,i){return '<tr'+(r.id===prof.id?' class="me"':'')+'><td>'+(i+1)+'</td><td>'+esc(r.pseudo)+'</td><td class="c"><b>'+fmtN(r.total)+'</b>'+(r.engaged?'<br><small>dont '+fmtN(r.engaged)+' engagés</small>':'')+'</td><td class="c">'+r.won+'-'+r.lost+'</td></tr>';}).join('')+
      '</tbody></table></div>';
  }else h+='<p class="note">'+(lbErr?esc(lbErr):'Chargement du classement…')+'</p>';
  if(lbErr&&lbRows)h+='<p class="note">'+esc(lbErr)+'</p>';
  return h+'<button class="btn" data-act="lbleave" style="margin-top:8px">Quitter la ligue</button></section>';
}
setInterval(function(){if(!document.hidden&&ui.tab==='bets')loadBoard();},60000);

/* ---- editing ---- */
function opts(sel,val){sel.innerHTML='<option value="">À déterminer</option>'+TEAMS.concat(['Cloud9 KIA','FURIA','MVK Esports']).map(function(t){return '<option'+(t===val?' selected':'')+'>'+esc(t)+'</option>';}).join('');}
function openEdit(id){
  var m=state.matches.filter(function(x){return x.id===id;})[0];if(!m)return;
  editing=m;
  $('dlgTitle').textContent=m.label+' · '+m.fmt;
  var derived=!!m.from,t=teams(m);
  opts($('fA'),t[0]);opts($('fB'),t[1]);
  $('fA').disabled=$('fB').disabled=derived;
  $('fSA').value=m.sa==null?'':m.sa;$('fSB').value=m.sb==null?'':m.sb;
  $('fT').value=m.t?toParisInput(m.t):'';
  $('dlg').showModal();
}
$('view').addEventListener('click',function(e){
  var bb=e.target.closest('[data-bet]');if(bb){openBet(bb.dataset.bet);return;}
  var b=e.target.closest('.m');if(b)openEdit(b.dataset.id);
});
$('view').addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var b=e.target.closest('div.m');if(b&&e.target===b){e.preventDefault();openEdit(b.dataset.id);}});
$('fCancel').onclick=function(){$('dlg').close();};
$('fClear').onclick=function(){if(editing){delete over[editing.id];persist();rebuild();render();}$('dlg').close();};
$('form').addEventListener('submit',function(e){
  e.preventDefault();
  var m=editing;if(!m)return;
  var o={},a=$('fSA').value,b=$('fSB').value,cur=teams(m);
  if(!m.from){
    var na=$('fA').value||null,nb=$('fB').value||null;
    if(na!==cur[0]||nb!==cur[1]){o.a=na;o.b=nb;}
  }
  var sa2=a===''?null:+a,sb2=b===''?null:+b;
  if(sa2!==(m.sa==null?null:m.sa)||sb2!==(m.sb==null?null:m.sb)){o.sa=sa2;o.sb=sb2;}
  var t=$('fT').value;if(t){var iso=fromParisInput(t);if(iso&&Date.parse(iso)!==Date.parse(m.t))o.t=iso;}
  var prev=over[m.id]||{};
  if(Object.keys(o).length)over[m.id]=Object.assign(prev,o);
  $('dlg').close();persist();rebuild();render();
});

$('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;ui.tab=b.dataset.t;try{localStorage.setItem('w26tab',ui.tab);}catch(x){}render();});
$('view').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.dataset.act;
  if(a==='lbjoin'){
    var ps=($('lbPseudo').value||'').trim(),lg=($('lbLeague').value||'').trim().toLowerCase();
    if(ps.length<2||!/^[a-z0-9]{3,20}$/.test(lg)){lbErr='Pseudo de 2 caractères minimum et code de 3 à 20 lettres ou chiffres (sans espace ni accent).';render();return;}
    prof={id:newId(),token:rnd(),league:lg,pseudo:ps};lbErr='';
    pushScore(true).then(function(){try{localStorage.setItem('w26profile',JSON.stringify(prof));}catch(x){}render();}).catch(function(){prof=null;render();});
    return;
  }
  if(a==='lbleave'){prof=null;lbRows=null;lbErr='';try{localStorage.removeItem('w26profile');}catch(x){}render();return;}
  if(a==='refill'){wallet.balance+=500;saveW();render();return;}
  if(a==='resetbets'){wallet={balance:START,bets:[]};saveW();render();return;}
  if(a==='fold'){ui.fold=!ui.fold;try{localStorage.setItem('w26fold',ui.fold?'1':'0');}catch(x){}render();return;}
  var list=sorted().filter(function(m){return inTab(m,ui.tab)&&(!ui.favOnly||hasFav(m));}),keys=[];
  list.forEach(function(m){var k=dayKey(m);if(keys.indexOf(k)<0)keys.push(k);});
  var i=keys.indexOf(ui.day[ui.tab])+(a==='next'?1:-1);
  if(i>=0&&i<keys.length){ui.day[ui.tab]=keys[i];render();}
});
function drawFavList(){
  $('favList').innerHTML=TEAMS.slice().sort().map(function(t){
    return '<label class="favrow"><input type="checkbox" value="'+esc(t)+'"'+(FAV[t]?' checked':'')+'>'+logo(t)+'<i style="background:'+favColor(t)+'"></i>'+esc(t)+'</label>';
  }).join('');
}
$('favEdit').onclick=function(){drawFavList();$('favDlg').showModal();};
$('favDone').onclick=function(){$('favDlg').close();};
$('favList').addEventListener('change',function(e){
  var t=e.target.value;
  favList=favList.filter(function(x){return x!==t;});
  if(e.target.checked)favList.push(t);
  setFavs(favList);
  try{localStorage.setItem('w26favs',JSON.stringify(favList));}catch(x){}
  render();
});
$('favOnly').addEventListener('change',function(){ui.favOnly=this.checked;try{localStorage.setItem('w26fav',ui.favOnly?'1':'0');}catch(x){}render();});

/* ---- voir le visuel : un clic sur une zone vide masque les cartes ---- */
function setFocus(on){document.body.classList.toggle('focus',on);}
$('eye').onclick=function(e){e.stopPropagation();setFocus(!document.body.classList.contains('focus'));};
document.addEventListener('click',function(e){
  if(e.target.closest('button,a,input,select,label,dialog,.m,.tbl,.fold,.next,.note,.tabs,.favbar,.pager,.foot'))return;
  setFocus(!document.body.classList.contains('focus'));
});
var BUILD='20261027124839';
/* si une version plus recente existe, on recharge avec une adresse neuve (evite le cache du telephone) */
fetch('version.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(v){
  if(v&&v.build&&v.build!==BUILD&&location.search.indexOf('b='+v.build)<0){
    var u=new URL(location.href);u.searchParams.set('b',v.build);location.replace(u.toString());
  }
}).catch(function(){});
rebuild();render();loadApi();loadRatings();
setInterval(function(){if(!document.hidden)loadApi();},45000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)loadApi();});
})();
</script>
